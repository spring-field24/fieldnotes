<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hattie's Visible Learning — 分野別効果量比較</title>
<style>

  :root {
    --bg: #0f0f13;
    --surface: #17171e;
    --border: #2a2a38;
    --text: #e8e8f0;
    --muted: #7070a0;
    --hinge: #ff6b35;

    --col-student: #6ee7b7;
    --col-teacher: #f59e0b;
    --col-teaching: #818cf8;
    --col-curricula: #f472b6;
    --col-school: #38bdf8;
    --col-home: #a78bfa;
    --col-classroom: #34d399;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  header {
    padding: 2.5rem 2rem 1.5rem;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(15,15,19,0.95);
    backdrop-filter: blur(8px);
    z-index: 100;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.2rem, 3vw, 1.7rem);
    letter-spacing: 0.02em;
    font-weight: 700;
  }

  header h1 span {
    color: var(--hinge);
  }

  .subtitle {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 0.3rem;
    font-family: 'DM Mono', monospace;
  }

  .tabs {
    display: flex;
    gap: 0.5rem;
    margin-top: 1rem;
    flex-wrap: wrap;
  }

  .tab {
    padding: 0.3rem 0.9rem;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .tab.active {
    color: #0f0f13;
  }

  .tab:not(.active) {
    background: var(--surface);
    border-color: var(--border);
    color: var(--muted);
  }

  .tab:hover:not(.active) {
    border-color: var(--muted);
    color: var(--text);
  }

  main {
    padding: 1.5rem 1.5rem 3rem;
    max-width: 960px;
    margin: 0 auto;
  }

  /* Overview chart */
  .overview-section {
    margin-top: 1.5rem;
  }

  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 1rem;
  }

  /* Domain summary cards */
  .domain-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .domain-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.2rem;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
    position: relative;
    overflow: hidden;
  }

  .domain-card:hover {
    transform: translateY(-2px);
  }

  .domain-card.selected {
    border-color: currentColor;
  }

  .domain-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: currentColor;
    opacity: 0.8;
  }

  .domain-name {
    font-size: 0.9rem;
    font-weight: 500;
    margin-bottom: 0.5rem;
  }

  .domain-name-en {
    font-size: 0.68rem;
    font-family: 'DM Mono', monospace;
    opacity: 0.6;
    display: block;
    margin-bottom: 0.8rem;
  }

  .domain-stats {
    display: flex;
    gap: 1rem;
    align-items: flex-end;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }

  .stat-value {
    font-family: 'DM Mono', monospace;
    font-size: 1.4rem;
    font-weight: 500;
    line-height: 1;
  }

  .stat-label {
    font-size: 0.65rem;
    color: var(--muted);
  }

  .mini-bar-container {
    flex: 1;
    align-self: flex-end;
    padding-bottom: 4px;
  }

  .mini-bar-track {
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
  }

  .mini-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: currentColor;
    opacity: 0.7;
  }

  .hinge-note {
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 0.6rem;
  }

  .hinge-note strong {
    color: var(--hinge);
  }

  /* Detail section */
  .detail-section {
    display: none;
    margin-top: 0.5rem;
    animation: fadeIn 0.3s ease;
  }

  .detail-section.visible {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .detail-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.2rem;
    padding-bottom: 0.8rem;
    border-bottom: 1px solid var(--border);
  }

  .detail-title {
    font-size: 1rem;
    font-weight: 500;
  }

  .detail-count {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
  }

  /* Horizontal bar chart */
  .bar-list {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .bar-item {
    display: grid;
    grid-template-columns: 200px 1fr 56px;
    align-items: center;
    gap: 0.6rem;
    padding: 0.4rem 0.6rem;
    border-radius: 4px;
    transition: background 0.15s;
  }

  .bar-item:hover {
    background: rgba(255,255,255,0.04);
  }

  .bar-name {
    font-size: 0.75rem;
    color: var(--text);
    line-height: 1.3;
    padding-right: 0.4rem;
  }

  .bar-track {
    height: 10px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    position: relative;
    overflow: visible;
  }

  .bar-fill {
    height: 100%;
    border-radius: 2px;
    position: relative;
    transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .hinge-line {
    position: absolute;
    top: -4px;
    bottom: -4px;
    width: 2px;
    background: var(--hinge);
    opacity: 0.6;
    border-radius: 1px;
  }

  .bar-value {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    text-align: right;
    color: var(--muted);
  }

  .bar-value.high {
    color: var(--text);
    font-weight: 500;
  }

  .bar-item.negative .bar-fill {
    background: #ef4444 !important;
    opacity: 0.7;
  }

  .hinge-legend {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.8rem;
    font-size: 0.68rem;
    color: var(--muted);
  }

  .hinge-legend-line {
    width: 18px;
    height: 2px;
    background: var(--hinge);
    border-radius: 1px;
  }

  /* Comparison view */
  .compare-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 2rem;
  }

  .compare-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.2rem;
  }

  .compare-block-title {
    font-size: 0.82rem;
    font-weight: 500;
    margin-bottom: 0.3rem;
  }

  .compare-block-en {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  /* Top picks */
  .top-pick-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .top-pick {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.5rem 0.6rem;
    background: rgba(255,255,255,0.03);
    border-radius: 4px;
    border-left: 3px solid transparent;
  }

  .top-pick-rank {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    width: 20px;
    flex-shrink: 0;
  }

  .top-pick-name {
    font-size: 0.78rem;
    flex: 1;
  }

  .top-pick-domain-badge {
    font-size: 0.6rem;
    padding: 0.15rem 0.4rem;
    border-radius: 999px;
    opacity: 0.8;
    color: #0f0f13;
    flex-shrink: 0;
  }

  .top-pick-es {
    font-family: 'DM Mono', monospace;
    font-size: 0.82rem;
    font-weight: 500;
    flex-shrink: 0;
  }

  footer {
    text-align: center;
    padding: 2rem;
    font-size: 0.65rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    margin-top: 2rem;
    font-family: 'DM Mono', monospace;
  }
</style>
</head>

// Compute stats
function domainStats(items) {
  const valid = items.filter(i => i.d > 0);
  const avg = valid.reduce((s, i) => s + i.d, 0) / valid.length;
  const max = Math.max(...items.map(i => i.d));
  const aboveHinge = valid.filter(i => i.d >= 0.40).length;
  return { avg: +avg.toFixed(2), max, aboveHinge, total: items.length };
}

      <div class="domain-stats">
        <div class="stat">
          <span class="stat-value" style="color:${domain.hex}">${stats.avg}</span>
          <span class="stat-label">平均 d</span>
        </div>
        <div class="stat">
          <span class="stat-value" style="color:${domain.hex}; font-size:1rem">${stats.max}</span>
          <span class="stat-label">最大 d</span>
        </div>
        <div class="stat">
          <span class="stat-value" style="color:${domain.hex}; font-size:1rem">${stats.aboveHinge}/${stats.total}</span>
          <span class="stat-label">ヒンジ超え</span>
        </div>
        <div class="mini-bar-container">
          <div class="mini-bar-track">
            <div class="mini-bar-fill" style="width:${(stats.avg/MAX_D*100).toFixed(1)}%"></div>
          </div>
          <p class="hinge-note" style="margin-top:4px">最高 <strong>${stats.max}</strong></p>
        </div>
      </div>
    `;
    card.onclick = () => {
      showView('detail');
      showDomainDetail(key);
    };
    grid.appendChild(card);
  }
}

// Build domain tabs
function buildDomainTabs() {
  const tabsEl = document.getElementById('domainTabs');
  tabsEl.innerHTML = '';
  for (const [key, domain] of Object.entries(DOMAINS)) {
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.id = `dtab-${key}`;
    btn.textContent = domain.label;
    btn.onclick = () => showDomainDetail(key);
    tabsEl.appendChild(btn);
  }
}

let currentDomain = null;

function showDomainDetail(key) {
  currentDomain = key;
  const domain = DOMAINS[key];
  
  // Update tab active state
  document.querySelectorAll('#domainTabs .tab').forEach(t => {
    t.classList.remove('active');
    t.style.background = '';
    t.style.color = '';
  });
  const activeTab = document.getElementById(`dtab-${key}`);
  if (activeTab) {
    activeTab.classList.add('active');
    activeTab.style.background = domain.hex;
    activeTab.style.color = '#0f0f13';
  }

  const sorted = [...domain.items].sort((a, b) => b.d - a.d);
  const stats = domainStats(domain.items);

  const content = document.getElementById('detailContent');
  content.innerHTML = `
    <div class="compare-block" style="border-color:${domain.hex}33; margin-bottom:1rem">
      <div class="detail-header">
        <div>
          <div class="detail-title" style="color:${domain.hex}">${domain.label} <span style="color:var(--muted); font-size:0.7rem; font-family:'DM Mono',monospace">${domain.en}</span></div>
        </div>
        <div style="display:flex; gap:1.2rem; margin-left:auto">
          <div class="stat"><span class="stat-value" style="color:${domain.hex}; font-size:1.1rem">${stats.avg}</span><span class="stat-label">平均 d</span></div>
          <div class="stat"><span class="stat-value" style="color:${domain.hex}; font-size:1.1rem">${stats.aboveHinge}/${stats.total}</span><span class="stat-label">ヒンジ超え</span></div>
        </div>
      </div>
      <div class="hinge-legend">
        <div class="hinge-legend-line"></div>
        <span>オレンジの縦線 = ヒンジポイント d=0.40</span>
      </div>
      <div class="bar-list">
        ${sorted.map(item => {
          const isNeg = item.d < 0;
          const pct = Math.abs(item.d) / MAX_D * 100;
          const hingePct = 0.40 / MAX_D * 100;
          return `
          <div class="bar-item${isNeg ? ' negative' : ''}">
            <div class="bar-name">${item.ja}<br><span style="font-size:0.62rem; color:var(--muted)">${item.name}</span></div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${pct}%; background:${isNeg ? '#ef4444' : domain.hex}; opacity:${item.d >= 0.4 ? 0.85 : 0.4}"></div>
              <div class="hinge-line" style="left:${hingePct}%"></div>
            </div>
            <div class="bar-value${item.d >= 0.8 ? ' high' : ''}">${item.d.toFixed(2)}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

// Build top list
function buildTopList() {
  const all = [];
  for (const [key, domain] of Object.entries(DOMAINS)) {
    for (const item of domain.items) {
      all.push({ ...item, domainKey: key, domainLabel: domain.label, domainHex: domain.hex });
    }
  }
  all.sort((a, b) => b.d - a.d);
  const top20 = all.slice(0, 20);

  const container = document.getElementById('topList');
  const hingePct = 0.40 / MAX_D * 100;

  container.innerHTML = top20.map((item, i) => `
    <div class="bar-item">
      <div class="bar-name">
        <span style="color:var(--muted); font-size:0.65rem; margin-right:4px">#${i+1}</span>
        ${item.ja}<br>
        <span style="font-size:0.62rem; color:var(--muted)">${item.name}</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${(item.d/MAX_D*100).toFixed(1)}%; background:${item.domainHex}; opacity:0.8"></div>
        <div class="hinge-line" style="left:${hingePct}%"></div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:2px">
        <span class="bar-value high">${item.d.toFixed(2)}</span>
        <span style="font-size:0.58rem; padding:1px 5px; border-radius:999px; background:${item.domainHex}22; color:${item.domainHex}">${item.domainLabel}</span>
      </div>
    </div>
  `).join('');
}

function showView(name) {
  document.getElementById('view-overview').style.display = name === 'overview' ? 'block' : 'none';
  document.getElementById('view-detail').style.display = name === 'detail' ? 'block' : 'none';
  document.getElementById('view-top').style.display = name === 'top' ? 'block' : 'none';
  ['overview','detail','top'].forEach(v => {
    document.getElementById(`tab-${v}`).classList.toggle('active', v === name);
  });
  if (name === 'detail' && !currentDomain) {
    showDomainDetail('teaching');
  }
}

// Init
buildOverview();
buildDomainTabs();
buildTopList();
</script>
</body>
</html>
